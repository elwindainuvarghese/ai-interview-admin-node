<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Agent — Admin Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#080c10;
    --panel:rgba(15,22,30,0.85);
    --panel-raised:rgba(22,32,44,0.9);
    --border:rgba(32,196,120,0.15);
    --border-glow:rgba(32,196,120,0.35);
    --text:#e8f0eb;
    --muted:#6b7c72;
    --green:#1db96a;
    --green-soft:rgba(29,185,106,0.12);
    --green-glow:rgba(29,185,106,0.25);
    --teal:#00e5a0;
    --coral:#f05a6e;
    --amber:#f5c842;
    --mono: 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(29,185,106,0.18) 0%, transparent 65%),
      radial-gradient(ellipse 40% 40% at 80% 80%, rgba(0,229,160,0.08) 0%, transparent 60%);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--border-glow);
    border-radius:20px;
    padding:40px 36px;
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    box-shadow:0 0 0 1px rgba(29,185,106,0.08), 0 32px 80px rgba(0,0,0,0.7), 0 0 60px rgba(29,185,106,0.08);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;
    top:-1px; left:20%; right:20%;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(29,185,106,0.6),transparent);
  }
  .brand-logo{
    width:44px; height:44px;
    background:linear-gradient(135deg,rgba(29,185,106,0.2),rgba(0,229,160,0.1));
    border:1px solid rgba(29,185,106,0.3);
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:20px;
    font-size:22px;
  }
  .brand{font-size:20px; font-weight:800; letter-spacing:-0.02em; color:#fff; margin-bottom:4px;}
  .brand-sub{
    font-size:11px;
    color:var(--muted);
    font-family:var(--mono);
    text-transform:uppercase;
    letter-spacing:0.12em;
    margin-bottom:28px;
  }
  .field{margin-bottom:18px;}
  .field label{
    display:block;
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:8px;
  }
  input, select{
    width:100%;
    background:rgba(10,18,14,0.7);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:12px 14px;
    font-family:var(--sans);
    font-size:14px;
    transition:border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(29,185,106,0.12);
  }
  select option{background:#0d1a12;}
  .btn-primary{
    width:100%;
    margin-top:8px;
    padding:13px 14px;
    border-radius:10px;
    border:none;
    background:linear-gradient(135deg,#1db96a,#00c87d);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:0.02em;
    transition:all .2s;
    box-shadow:0 4px 24px rgba(29,185,106,0.3);
    position:relative;
    overflow:hidden;
  }
  .btn-primary::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent);
    opacity:0;
    transition:opacity .2s;
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 6px 32px rgba(29,185,106,0.45);}
  .btn-primary:hover::after{opacity:1;}
  .btn-primary:active{transform:translateY(0);}
  .btn-primary:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  .error{
    color:#ff6b7a;
    font-size:13px;
    margin-bottom:14px;
    min-height:18px;
    padding:8px 12px;
    border-radius:8px;
    background:rgba(240,90,110,0.08);
    border:1px solid rgba(240,90,110,0.15);
    display:none;
  }
  .error:not(:empty){display:block;}
  .hint{
    font-size:12px;
    color:var(--muted);
    margin-top:20px;
    line-height:1.6;
    text-align:center;
  }
</style>

</head>
<body>

<div class="card">
  <div class="brand-logo">🛡️</div>
  <div class="brand">Interview Agent</div>
  <div class="brand-sub">Admin Login</div>

  <div class="error" id="error"></div>

  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="category">What do you want to check or add questions for?</label>
      <select id="category">
        <option value="All">All categories</option>
      </select>
    </div>
    <button type="submit" class="btn-primary" id="login-btn">Log in</button>
  </form>

  <div class="hint">You can switch categories anytime from inside the admin panel.</div>
</div>

<script>
// Populate the category picker from whatever's already in the question bank
async function loadCategories(){
  const select = document.getElementById('category');
  try{
    const res = await fetch('/api/categories');
    const categories = await res.json();
    const defaults = ['HTML', 'Java', 'Python'];
    const merged = [...new Set([...defaults, ...categories])].sort();
    merged.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }catch(e){
    // If this fails, "All categories" is still there as a fallback
  }
}
loadCategories();

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const category = document.getElementById('category').value;
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('login-btn');

  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Logging in…';

  try{
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok){
      throw new Error(data.error || 'Login failed');
    }
    localStorage.setItem('ia_token', data.token);
    localStorage.setItem('ia_category', category);
    window.location.href = 'admin.html';
  }catch(err){
    errorEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Log in';
  }
});
</script>

</body>
</html>
